# No job here uses a secret, and no step needs the network beyond installing
# the package under test. The evidence corpus is committed and deterministic.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with dev extra
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  core-zero-deps:
    # The package promises a stdlib-only core. This job installs with no
    # extras into a bare interpreter and exercises the gate end to end, so
    # the promise is checked on every push rather than asserted in prose.
    # Order matters: the import-and-run proof happens before pytest exists
    # in the environment, then the core suite runs with no framework
    # installed (spec section 11).
    name: Core installs and runs with zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with no extras
        run: python -m pip install .
      - name: Assert the core declares no dependencies
        run: |
          python - <<'EOF'
          from importlib.metadata import requires

          reqs = requires("toolwarden") or []
          core = [r for r in reqs if "extra ==" not in r]
          assert not core, f"core must stay dependency-free, found: {core}"
          EOF
      - name: Assert the core imports, decides, and fails closed
        run: |
          python - <<'EOF'
          import json

          from toolwarden import NOT_APPLICABLE, Allow, Facts, Gate, Verdict, policy
          from toolwarden.normalizers import SQL_CLASS, SqlClass, classify_sql

          @policy("db_read_scope", tools=("db_exec",), needs=(SQL_CLASS,))
          def db_read_scope(f: Facts) -> Verdict:
              if f[SQL_CLASS] is SqlClass.READ:
                  return Allow()
              return NOT_APPLICABLE

          gate = Gate(
              policies=[db_read_scope],
              normalizers=[classify_sql],
              tools=("db_exec",),
          )

          allowed = gate.decide(
              tool="db_exec", args={"query": "SELECT 1"}, principal={"env": "ci"}
          )
          assert allowed.allowed, allowed

          # Deny by default: a write finds no permit.
          no_permit = gate.decide(
              tool="db_exec", args={"query": "DROP TABLE users"}, principal={"env": "ci"}
          )
          assert not no_permit.allowed
          assert no_permit.outcome is not None
          assert no_permit.outcome.kind.value == "no_permit", no_permit.outcome

          # The safety invariant: a bad input never becomes an allow. A
          # non-string query is Unavailable, and the engine denies before
          # the policy body runs.
          unparseable = gate.decide(
              tool="db_exec", args={"query": 42}, principal={"env": "ci"}
          )
          assert not unparseable.allowed
          assert unparseable.outcome is not None
          assert unparseable.outcome.kind.value == "unparseable", unparseable.outcome

          # The record body is canonical JSON and byte-stable across decides.
          json.loads(no_permit.record())
          again = gate.decide(
              tool="db_exec", args={"query": "DROP TABLE users"}, principal={"env": "ci"}
          )
          assert no_permit.record() == again.record()
          print("zero-dependency core: import, allow, deny, fail-closed all verified")
          EOF
      - name: Core test suite with no framework installed
        run: |
          python -m pip install pytest
          pytest tests/core

  evidence:
    # Spec section 12: every published number comes from this command and
    # nowhere else. run.py asserts every corpus expectation, byte-compares
    # record bodies against the committed golden file, and greps records for
    # planted secrets; a nonzero exit fails the build. The matrix exists for
    # the byte-stability bet (spec section 14.4): all three minors must agree
    # with one committed golden file.
    name: Evidence replay (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with no extras (the evidence run is stdlib only)
        run: python -m pip install .
      - name: Replay the corpus and check every expectation
        run: python evidence/run.py
      - name: Confirm the replay modified no committed evidence file
        run: git diff --exit-code -- evidence/

  extras-smoke:
    # Spec section 11 calls this job optional: adapter correctness is proven
    # offline against stubs in the matrix job above; this one installs the
    # real frameworks and runs the thin smoke tests against them. A framework
    # release outside this repo must not block core changes, so failure here
    # is signal, not a gate.
    name: Adapter smoke tests against installed frameworks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with all adapter extras
        run: python -m pip install -e ".[dev,openai-agents,anthropic,langchain]"
      - name: Adapter modules import with frameworks present
        run: |
          python -c "import toolwarden.adapters.openai_agents"
          python -c "import toolwarden.adapters.anthropic_loop"
          python -c "import toolwarden.adapters.langchain"
      - name: Adapter tests, smoke cases included
        run: pytest tests/adapters -v
